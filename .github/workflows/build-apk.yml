name: Compiler l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fantesia-app/jellyfin_fantesia
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Recuperer les dependances
        run: flutter pub get

      - name: Generer et configurer la partie Android
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Compiler l'APK universel
        run: flutter build apk --release

      - name: Compiler l'APK split par ABI
        run: flutter build apk --release --split-per-abi

      - name: Publier les APK
        uses: actions/upload-artifact@v4
        with:
          name: fantesia-apk
          path: fantesia-app/jellyfin_fantesia/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
